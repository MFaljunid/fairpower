# fairpower: shared settings (see docs/EXPERIMENT_LOG.md). Protocol as in leveldown.
seed: 42
tie_break: random

datasets:
  ml-100k: {raw_dir: data/raw/ml-100k}     # u.data, u.user
  ml-1m:   {raw_dir: data/raw/ml-1m}       # ratings.dat, users.dat
  gowalla: {raw_dir: data/raw/gowalla, core: 10}   # SNAP loc-gowalla_totalCheckins.txt(.gz); first visits, 10-core

eval:
  k: 10
  bootstrap: 1000

power:
  reps: 500

grids:                                     # selected on validation NDCG@10 (full ranking)
  ials: {dim: [64], alpha: [1.0, 5.0, 20.0], reg: [1.0, 10.0, 100.0], iters: [10]}
  ease: {lam: [50.0, 200.0, 500.0, 2000.0]}
  bpr:  {dim: [64], lr: [0.05], reg: [0.0001, 0.001], epochs: [20, 40], batch: [4096]}

selection:
  weights: [1, 2, 4, 8, 16]               # iALS reweighting of the disadvantaged group (1 = base)

noise:
  ratios: [0.8, 0.1, 0.1]                 # random split of all interactions (train, validation, test)